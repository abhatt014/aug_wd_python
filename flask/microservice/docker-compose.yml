# Crust & Co. pizza shop as microservices.
#   cp .env.example .env
#   docker compose up --build
# Then open http://localhost:5000 (only `web` is published; the APIs stay on the internal network).

x-service-healthcheck: &service-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-db-env: &db-env
  DB_HOST: db
  DB_NAME: pizza
  DB_USER: dbuser
  DB_PASSWORD: ${DB_PASSWORD:-redhat}
  TZ: ${TZ:-Asia/Kolkata}

x-api-service: &api-service
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  healthcheck: *service-healthcheck
  networks: [backend]

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pizza
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${DB_PASSWORD:-redhat}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - db_data:/var/lib/mysql
      # Runs only on the first start, while the db_data volume is empty
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  user-service:
    <<: *api-service
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment: *db-env

  menu-service:
    <<: *api-service
    build:
      context: .
      dockerfile: services/menu-service/Dockerfile
    environment: *db-env

  order-service:
    <<: *api-service
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *db-env
      MENU_SERVICE_URL: http://menu-service:5000
    depends_on:
      db:
        condition: service_healthy
      menu-service:
        condition: service_healthy

  message-service:
    <<: *api-service
    build:
      context: .
      dockerfile: services/message-service/Dockerfile
    environment: *db-env

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      USER_SERVICE_URL: http://user-service:5000
      MENU_SERVICE_URL: http://menu-service:5000
      ORDER_SERVICE_URL: http://order-service:5000
      MESSAGE_SERVICE_URL: http://message-service:5000
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      user-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
    networks: [backend]

networks:
  backend:

volumes:
  db_data:
