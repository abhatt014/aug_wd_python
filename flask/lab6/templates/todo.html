<!DOCTYPE html>
<html lang="en">
<head>
    <title>Welcome {{ user }}</title>
    <style>
        body {
            font-family: 'Segoe UI';
            margin: 40px;
            background-color: #f0f8ff;
            text-align: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #005a9c;
        }

        p {
            font-size: 1.2em;
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
    </style>
</head>

<body>
    <div class="container">
    <ul>
        {% if not todos %}
            <li>No tasks to display.</li>
        {% else %}
            {% for task in todos %}
                <li><input type="checkbox"> {{ task }}</li>
            {% endfor %}
        {% endif %}
    </ul>

    </div>
</body>

</html>
